# Copies Firebase's sign-in helper pages onto this site (served at tvtracker.us/__/auth/…),
# so Google sign-in can run on our own domain and say "continue to tvtracker.us"
# instead of the firebaseapp.com address. Runs when this file changes, monthly to pick up
# Firebase updates, and on demand from the Actions tab ("Run workflow").
name: Update Firebase auth helpers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/firebase-auth-helpers.yml']
  schedule:
    - cron: '17 9 3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download helper files from Firebase
        run: |
          set -euo pipefail
          project=$(grep -oP "projectId:\s*'\K[^']+" firebase-config.js)
          base="https://${project}.firebaseapp.com"
          mkdir -p __/auth __/firebase
          # GitHub Pages serves /__/auth/handler from handler.html (no-extension files would download instead of render)
          get() { # $1 = path on firebaseapp.com, $2 = where to save, $3 = "optional" to skip a 404
            code=$(curl -sSL -w '%{http_code}' -o "$2" "$base/$1")
            echo "$1 -> $code"
            if [ "$code" != 200 ]; then
              rm -f "$2"
              [ "${3:-}" = optional ] || { echo "::error::Could not download $1 (HTTP $code)"; exit 1; }
            fi
          }
          get __/auth/handler        __/auth/handler.html
          get __/auth/handler.js     __/auth/handler.js
          get __/auth/iframe         __/auth/iframe.html
          get __/auth/iframe.js      __/auth/iframe.js
          get __/auth/experiments.js __/auth/experiments.js optional
          get __/firebase/init.json  __/firebase/init.json  optional
          ls -la __/auth __/firebase

      - name: Commit if changed
        run: |
          git add __
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Firebase auth helper files"
          git push
