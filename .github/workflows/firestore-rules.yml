# Publishes firestore.rules to Firebase whenever it changes on main, so the live database rules always match
# this repo (no copying and pasting into the console). Also runs on demand from the Actions tab ("Run workflow").
# Uses the same FIREBASE_SERVICE_ACCOUNT secret as the weekly email. If it fails with a permission error, that
# service account needs the "Firebase Rules Admin" role (Google Cloud console → IAM).
name: Publish Firestore rules

on:
  push:
    branches: [main]
    paths: ['firestore.rules', '.github/workflows/firestore-rules.yml', 'email/publish-rules.mjs']
  workflow_dispatch:

permissions:
  contents: read

concurrency: firestore-rules

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: email
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email/package-lock.json
      - run: npm ci
      - name: Publish rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::The FIREBASE_SERVICE_ACCOUNT secret isn't set (see Weekly email in README.md)."; exit 1; fi
          node publish-rules.mjs
