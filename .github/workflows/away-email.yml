# "It's been a while" email for accounts with no activity in 30 days (email/away-send.mjs), daily at 10:47am Arizona and on
# demand from the Actions tab. Sends nothing until the RESEND_API_KEY secret is set (see "Away email" in README.md).
#   test    - emails the site owner a sample
#   dry-run - sends nothing; the log says how many people would get one
#   send    - the normal daily run
name: Away email

on:
  schedule:
    - cron: '47 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = send the site owner a sample, dry-run = send nothing, send = the normal run'
        type: choice
        options: [test, dry-run, send]
        default: test

permissions:
  contents: read

concurrency: away-email   # never two runs at once, so nobody gets it twice

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: email
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email/package-lock.json
      - run: npm ci
      - run: node away-send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MODE: ${{ inputs.mode || 'send' }}
          TEST_TO: jeremykholmes@gmail.com
