  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <style>
    /* Shown instantly, before styles.css and the app load, so a fresh visit isn't a blank screen. */
    html, body { background: #0e1014; color: #eef1f6; }
    @media (prefers-color-scheme: light) { html, body { background: #f4f5f7; color: #141821; } }
    .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      min-height: 60vh; color: #98a1b0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .splash img { width: 72px; height: 72px; animation: splash-pulse 1.4s ease-in-out infinite; }
    .splash p { margin: 0; }
    @keyframes splash-pulse { 50% { opacity: .45; transform: scale(.94); } }
    @media (prefers-reduced-motion: reduce) { .splash img { animation: none; } }
  </style>
  <script>
    // Links in emails use ?show=<id>&from=<name> (no #, which some email apps and link redirects drop):
    // turn them into the app's own address for that show before it starts.
    (function () {
      var q = new URLSearchParams(location.search), id = q.get('show');
      if (!/^\d+$/.test(id || '')) return;
      var from = (q.get('from') || '').slice(0, 40);
      history.replaceState(null, '', location.pathname + '#/show/' + id + (from ? '/' + encodeURIComponent(from) : ''));
    })();
    // Load the newest app files on every visit: a unique address skips any browser or GitHub cache.
    window.TVT_V = '?v=' + Date.now();
    document.write('<link rel="stylesheet" href="styles.css' + TVT_V + '">');
  </script>
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>
  <header class="top">
    <a href="#/" class="brand"><img src="icons/logo.svg" alt="" class="brandlogo"> TV Tracker</a>
    <nav class="tabs" id="tabs">
      <a href="#/" data-tab="shows"><span class="ico">▤</span>My Shows</a>
      <a href="#/upcoming" data-tab="upcoming"><span class="ico">◷</span>Upcoming</a>
      <a href="#/discover" data-tab="discover"><span class="ico">✦</span>Discover</a>
      <a href="#/search" data-tab="search"><span class="ico">＋</span>Add Show</a>
    </nav>
    <span class="sync" id="sync"></span>
    <button type="button" class="btn sm getapp" id="getapp" data-act="getapp" hidden><img src="icons/logo.svg" alt="" class="brandlogo sm"><span class="lbl">Get the app</span><span class="lbl-s">App</span></button>
    <a href="#/login" class="acct" id="acct" hidden></a>
    <button type="button" class="btn sm topout" id="topout" data-act="signout" hidden>Sign out</button>
  </header>
  <div class="busy" id="busy" hidden></div>
  <main id="app"><div class="splash"><img src="icons/logo.svg" alt=""><p>Loading your shows…</p></div></main>
  <div id="toast" class="toast" hidden></div>
  <dialog id="appDialog" class="appdlg"></dialog>
  <footer class="foot"><a href="#/contact">Contact us</a> · <a href="privacy.html">Privacy</a> · Show &amp; episode data from <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a> (CC BY-SA) · Recommendations from <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>.<br>This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
  <script type="module">import('./app.js' + window.TVT_V);</script>
</body>
