<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TV Tracker</title>
  <meta name="theme-color" content="#0e1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TV Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <script>
    // Load the newest app files on every visit: a unique address skips any browser or GitHub cache.
    window.TVT_V = '?v=' + Date.now();
    document.write('<link rel="stylesheet" href="styles.css' + TVT_V + '">');
  </script>
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>
  <header class="top">
    <a href="#/" class="brand"><img src="icons/logo.svg" alt="" class="logo"> TV Tracker</a>
    <nav class="tabs" id="tabs">
      <a href="#/" data-tab="shows"><span class="ico">▤</span>My Shows</a>
      <a href="#/upcoming" data-tab="upcoming"><span class="ico">◷</span>Upcoming</a>
      <a href="#/discover" data-tab="discover"><span class="ico">✦</span>Discover</a>
      <a href="#/search" data-tab="search"><span class="ico">＋</span>Add Show</a>
    </nav>
    <span class="sync" id="sync"></span>
    <button type="button" class="btn sm getapp" id="getapp" data-act="getapp" hidden><img src="icons/logo.svg" alt="" class="logo sm"><span class="lbl">Get the app</span><span class="lbl-s">App</span></button>
    <a href="#/login" class="acct" id="acct" hidden></a>
    <button type="button" class="btn sm topout" id="topout" data-act="signout" hidden>Sign out</button>
  </header>
  <div class="busy" id="busy" hidden></div>
  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>
  <dialog id="appDialog" class="appdlg"></dialog>
  <footer class="foot">Show &amp; episode data from <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a> (CC BY-SA) · Recommendations from <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>.<br>This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
  <script type="module">import('./app.js' + window.TVT_V);</script>
</body>
</html>
